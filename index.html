<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MechanicIt - Instant Roadside Assistance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-wrench text-amber-500 text-2xl"></i>
      <span class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">MechanicIt</span>
    </div>
    <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-1 rounded-full font-medium">⚡ 15-Min Arrival</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Hero Banner -->
    <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl p-5 text-slate-950 shadow-lg">
      <h1 class="text-2xl font-black mb-1">Stuck on the road?</h1>
      <p class="text-slate-900 font-medium text-sm">Get a verified mechanic dispatched to your live location in minutes.</p>
    </div>

    <!-- Booking Form -->
    <form id="bookingForm" class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-white border-b border-slate-700 pb-2">Request Assistance</h2>

      <!-- Name & Phone -->
      <div>
        <label class="block text-xs text-slate-400 mb-1">Your Full Name</label>
        <input type="text" id="custName" required placeholder="e.g. Rahul Sharma" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Mobile Number</label>
        <input type="tel" id="custPhone" required placeholder="e.g. 9876543210" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
      </div>

      <!-- Vehicle Details -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Vehicle Type</label>
          <select id="vehicleType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            <option value="Car 🚗">Car 🚗</option>
            <option value="Bike 🏍️">Bike / Scooter 🏍️</option>
            <option value="Auto / Commercial 🛺">Auto / Commercial 🛺</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Vehicle Model</label>
          <input type="text" id="vehicleModel" required placeholder="e.g. Swift / Activa" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <!-- Service Selection -->
      <div>
        <label class="block text-xs text-slate-400 mb-1">Required Service</label>
        <select id="serviceSelect" onchange="updatePriceDisplay()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
          <option value="Battery Jumpstart" data-price="299">🔋 Battery Jumpstart - ₹299</option>
          <option value="Flat Tire Repair" data-price="199">🛞 Flat Tire Repair - ₹199</option>
          <option value="Engine Repair" data-price="499">🔧 Engine / General Repair - ₹499</option>
          <option value="Towing Service" data-price="899">🛻 Flatbed Towing - ₹899</option>
          <option value="Emergency Fuel" data-price="149">⛽ Emergency Fuel Delivery - ₹149</option>
        </select>
      </div>

      <!-- Payment Method -->
      <div>
        <label class="block text-xs text-slate-400 mb-1">Payment Mode</label>
        <select id="paymentMode" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
          <option value="Direct UPI Payment">Instant UPI (Paytm / GPay / PhonePe / FamPay)</option>
          <option value="Cash / UPI to Mechanic after repair">Cash / UPI on Service Completion</option>
        </select>
      </div>

      <!-- Location Section -->
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 space-y-2">
        <label class="block text-xs text-slate-400">Location Details</label>
        <button type="button" id="locBtn" onclick="getLiveLocation()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-location-crosshairs"></i>
          <span id="locStatus">Fetch My Exact GPS Location</span>
        </button>
        <input type="text" id="addressInput" placeholder="Landmark or street address (optional)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none">
      </div>

      <!-- Price Breakdown Box -->
      <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400">Total Payable Amount:</span>
        <span id="priceBadge" class="text-lg font-black text-amber-400">₹299</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 flex items-center justify-center space-x-2 text-base transition">
        <i class="fa-solid fa-bolt text-lg"></i>
        <span>Pay & Dispatch Mechanic</span>
      </button>
    </form>
  </main>

  <script>
    // Configured UPI ID and Owner Details
    const OWNER_UPI_ID = "nikkushukla@fam";
    const OWNER_NAME = "MechanicIt Services";
    const OWNER_PHONE_NUMBER = "919204519277"; // Replace XXXXXXXXXX with your WhatsApp phone number

    let userLat = null;
    let userLng = null;

    // Update total price display based on selected dropdown item
    function updatePriceDisplay() {
      const select = document.getElementById('serviceSelect');
      const selectedOption = select.options[select.selectedIndex];
      const price = selectedOption.getAttribute('data-price');
      document.getElementById('priceBadge').innerText = `₹${price}`;
    }

    // Get live GPS location from browser
    function getLiveLocation() {
      const locStatus = document.getElementById('locStatus');
      if (!navigator.geolocation) {
        locStatus.innerText = "GPS not supported by browser";
        return;
      }
      locStatus.innerText = "Locating your position...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude.toFixed(6);
          userLng = pos.coords.longitude.toFixed(6);
          locStatus.innerText = `GPS Locked: ${userLat}, ${userLng} ✅`;
        },
        (err) => {
          locStatus.innerText = "GPS permission denied. Enter landmark below.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Auto-fetch location on page load
    window.addEventListener('load', () => {
      getLiveLocation();
      updatePriceDisplay();
    });

    // Form submission handler
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const vehicleType = document.getElementById('vehicleType').value;
      const vehicleModel = document.getElementById('vehicleModel').value;
      const serviceSelect = document.getElementById('serviceSelect');
      const serviceName = serviceSelect.value;
      const amount = serviceSelect.options[serviceSelect.selectedIndex].getAttribute('data-price');
      const paymentMode = document.getElementById('paymentMode').value;
      const address = document.getElementById('addressInput').value || "Not provided";

      let mapsLink = userLat && userLng 
        ? `https://maps.google.com/?q=${userLat},${userLng}` 
        : "GPS Not fetched";

      // 1. Build WhatsApp message string
      const whatsappMessage = `🚨 *NEW MECHANIC REQUEST* 🚨\n\n` +
        `👤 *Customer Name:* ${name}\n` +
        `📞 *Contact Number:* ${phone}\n` +
        `🚗 *Vehicle:* ${vehicleType} (${vehicleModel})\n` +
        `🔧 *Service:* ${serviceName}\n` +
        `💰 *Amount:* ₹${amount}\n` +
        `💳 *Payment Choice:* ${paymentMode}\n` +
        `📌 *Landmark/Address:* ${address}\n` +
        `🗺️ *Live GPS Location:* ${mapsLink}\n\n` +
        `Please confirm mechanic dispatch!`;

      const encodedMsg = encodeURIComponent(whatsappMessage);
      const whatsappURL = `https://wa.me/${OWNER_PHONE_NUMBER}?text=${encodedMsg}`;

      // 2. Trigger Payment / Dispatch sequence
      if (paymentMode === "Direct UPI Payment") {
        // Construct standard UPI deep link scheme
        const upiURI = `upi://pay?pa=${OWNER_UPI_ID}&pn=${encodeURIComponent(OWNER_NAME)}&am=${amount}&tn=${encodeURIComponent("MechanicIt Service")}&cu=INR`;
        
        // Open user's installed UPI App (GPay/PhonePe/Paytm/FamPay)
        window.location.href = upiURI;

        // Open WhatsApp booking details after a brief delay
        setTimeout(() => {
          window.open(whatsappURL, '_blank');
        }, 2000);
      } else {
        // Cash payment selected: directly open WhatsApp
        window.open(whatsappURL, '_blank');
      }
    });
  </script>
</body>
</html>
